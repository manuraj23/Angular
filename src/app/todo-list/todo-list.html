<h1 style="text-align: center; color: red;">Todo List</h1>

<input type="text" [(ngModel)]="task" placeholder="Enter Your task">
<button (click)="addTask()" >Add Task</button>

<!-- <p>{{task}}</p> -->

@for(task of taskList; track task.id){
  <ul class="task-list">
    <li>{{task.id}}</li>
    <li>{{task.task}}</li>
    <li><button (click)="deleteTask(task.id)" >Delete</button></li>
  </ul>
}
