<h1>Else-if Condition</h1>

<button (click)="handleColor(1)">Red</button>
<button (click)="handleColor(2)">Green</button>
<button (click)="handleColor(3)">Purple</button>
<button (click)="handleColor(4)">Other</button>

<br>
<hr>
<input type="text" (input)="handleInput($event)" placeholder="Enter Color Number"> 
<br>
<hr>
@if (color==1) {
    <div style="background-color: red; width: 100px; height: 100px;"></div>
}
@else if (color==2) {
    <div style="background-color: green; width: 100px; height: 100px;"></div>
}
@else if (color==3) {
    <div style="background-color: purple; width: 100px; height: 100px;"></div>
}
@else {
    <div style="background-color: black; width: 100px; height: 100px;"></div>

}
